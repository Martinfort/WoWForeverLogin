<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WoW Forever — Login Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050304;color:#ffcf40;font-family:Georgia,"Times New Roman",serif}#scene{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#b76b28 0%,#54301e 35%,#150e19 75%,#050304 100%)}#scene video{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(.75)}#scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08040b55,transparent 30%,transparent 70%,#08040b55)}#brand{position:absolute;top:3%;left:3%;z-index:2;max-width:28%;text-align:center;text-shadow:2px 3px 3px black,0 0 16px #000;color:#f9d474;font-weight:bold;font-size:clamp(16px,3.3vw,54px);line-height:.82;letter-spacing:-.05em}#brand small{display:block;font-size:.35em;letter-spacing:.3em;margin-top:.65em;color:#e7d5a6}#login{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;min-width:190px;text-align:center;text-shadow:1px 2px 2px #000}label{display:block;font-size:clamp(11px,1.35vw,20px);margin:12px 0 3px}input{width:100%;height:30px;background:linear-gradient(#111,#363a3b);border:3px ridge #8a8070;box-shadow:0 0 0 2px #080707,0 2px 9px #000;border-radius:5px;color:#eee;padding:3px 7px;font:16px Georgia}button{cursor:pointer;font:clamp(13px,1.6vw,24px) Georgia;color:#ffd264;text-shadow:1px 2px 2px #000;background:linear-gradient(#9c0b05,#750400 55%,#450200);border:3px ridge #b7a27b;border-radius:8px;box-shadow:0 0 0 2px #20160f,0 3px 10px #000;min-width:135px;padding:5px 18px}button:hover{filter:brightness(1.25)}#login button{margin-top:22px;width:90%}.modal{position:absolute;z-index:4;left:50%;top:33%;transform:translateX(-50%);width:min(62vw,760px);min-height:clamp(95px,20vh,205px);border:3px ridge #877359;box-shadow:0 0 0 2px #20120a,0 8px 22px #0009;background:linear-gradient(90deg,#391e0bcf,#1c2624d9 50%,#211712d9);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:12px 15px}.modal p{margin:1px;text-shadow:1px 2px #000,0 0 4px #000;font-size:clamp(15px,2.3vw,34px);line-height:1.06}.modal button{margin-top:10px;min-width:32%;padding:3px 12px}#status{font-size:clamp(14px,2vw,25px)}#footer{position:absolute;z-index:2;bottom:10px;width:100%;text-align:center;color:#cbb88e;font:clamp(8px,.9vw,13px) Georgia;text-shadow:1px 1px black}#notice{position:absolute;z-index:2;right:12px;bottom:12px;color:#cabda0;font:11px Arial;opacity:.75}#fullscreen{position:absolute;z-index:5;right:12px;top:12px;min-width:0;font:12px Arial;padding:5px 9px;opacity:.65}#queue{top:31%}@media(orientation:portrait){#scene video{width:178%;max-width:none;left:50%;transform:translateX(-50%)}#brand{max-width:45%;font-size:6vw}#login{width:45%}.modal{width:88vw;top:37%;min-height:130px}.modal p{font-size:clamp(16px,4vw,25px)}} 
</style></head><body><div id="scene"><video autoplay muted loop playsinline poster=""><source src="https://xiexe.github.io/WoWLoginScreens/assets/img/bg/Classic.webm" type="video/webm"><source src="https://xiexe.github.io/WoWLoginScreens/assets/img/bg/Classic.mp4" type="video/mp4"></video></div>
<div id="brand">WORLD<br>WARCRAFT<small>F O R E V E R</small></div>
<div id="login"><label for="account">Account Name</label><input id="account" autocomplete="off" placeholder="Account Name"><label for="password">Account Password</label><input id="password" type="password" autocomplete="off" placeholder="Password"><button id="loginBtn">Log In</button></div>
<div class="modal" id="connecting"><p id="status">Connecting...</p><button id="cancelConnect">Cancel</button></div>
<div class="modal" id="queue"><p>Login Servers are Full</p><p id="position">Position in queue: 23482</p><p id="estimate">Estimated time: 2 min</p><button id="cancelQueue">Cancel</button></div>
<div class="modal" id="disconnect"><p>You have been disconnected from the server.</p><p>(WOW51900319)</p><button id="again">Okay</button></div>
<button id="fullscreen">Fullscreen</button><div id="footer">Unofficial WoW Forever parody login simulation — no game connection or authentication</div>
<script>
const $=id=>document.getElementById(id);let timer=null,phaseTimers=[];function show(id){for(const x of ['login','connecting','queue','disconnect'])$(x).style.display=x===id?(id==='login'?'block':'flex'):'none'}function stop(){clearInterval(timer);phaseTimers.forEach(clearTimeout);phaseTimers=[]}function later(fn,ms){phaseTimers.push(setTimeout(fn,ms))}function reset(){stop();$('password').value='';show('login')}function begin(){stop();show('connecting');$('status').textContent='Authenticating...';later(()=>$('status').textContent='Connecting...',900);later(()=>$('status').textContent='Retrieving realm list...',1900);later(startQueue,2800)}function startQueue(){show('queue');const start=Date.now(),duration=120000;function tick(){const elapsed=Math.min(duration,Date.now()-start),remaining=Math.max(0,Math.ceil((duration-elapsed)/1000));const position=Math.max(0,Math.ceil(23482*(1-elapsed/duration)));$('position').textContent='Position in queue: '+position;$('estimate').textContent='Estimated time: '+(remaining>60?'2 min':remaining>0?'1 min':'0 min');if(remaining===0){clearInterval(timer);show('connecting');$('status').textContent='Logging in to game server';later(()=>$('status').textContent='Entering World...',1200);later(()=>show('disconnect'),3000)}}tick();timer=setInterval(tick,250)}$('loginBtn').onclick=begin;$('password').onkeydown=e=>{if(e.key==='Enter')begin()};$('cancelQueue').onclick=reset;$('cancelConnect').onclick=reset;$('again').onclick=reset;$('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};show('login');
</script></body></html>
